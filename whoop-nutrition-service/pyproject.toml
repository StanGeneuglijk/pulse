[project]
name = "whoop-nutrition-service"
version = "0.1.0"
description = "Conversational meal logging: LLM-estimated nutrition breakdowns, goal-aware guidance, and an additional data source for whoop-insight-service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.42.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "openai>=1.54.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is how pytest itself works; S105/S106 flag fixture fakes
# ("test-api-key") as if they were real hardcoded secrets — the standard
# exemption for a test directory, same as the other two services.
"tests/*" = ["S101", "S105", "S106", "S110"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
