services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition_platform
    # 5434/6381 — distinct from whoop-service's (5432/6379) and
    # whoop-insight-service's (5433/6380) own local containers, so all
    # three can run side by side during local development.
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6381:6379"]

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8002 --reload
    env_file: .env
    ports: ["8002:8002"]
    depends_on: [postgres, redis]
    volumes:
      - ".:/app"
      - "api-venv:/app/.venv"

volumes:
  pgdata:
  api-venv:
