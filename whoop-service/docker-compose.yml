services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whoop
      POSTGRES_PASSWORD: whoop
      POSTGRES_DB: whoop_platform
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    # No `uv run` prefix — the runtime image only has the built venv, never
    # the uv binary itself (that lives in the Dockerfile's builder stage
    # only). /app/.venv/bin is already on PATH, so call uvicorn directly,
    # matching the Dockerfile's own CMD and render.yaml's dockerCommand.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes:
      # Bind-mounting the whole directory over /app is what makes --reload
      # useful, but it also hides the image's own built .venv — a named
      # volume at exactly that sub-path takes precedence over the parent
      # bind mount and gets seeded from the image on first use, so the
      # container's real venv (Linux wheels, not the host's) shows through.
      - ".:/app"
      - "api-venv:/app/.venv"

  worker:
    build: .
    command: python -m workers.run
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - ".:/app"
      - "worker-venv:/app/.venv"

volumes:
  pgdata:
  api-venv:
  worker-venv:
