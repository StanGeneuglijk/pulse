services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight_platform
    # 5433/6380, not 5432/6379 — so this can run alongside
    # whoop-service's own docker-compose (its own local Postgres/Redis)
    # without a port collision during local development.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6380:6379"]

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload
    env_file: .env
    ports: ["8001:8001"]
    depends_on: [postgres, redis]
    volumes:
      - ".:/app"
      - "api-venv:/app/.venv"

volumes:
  pgdata:
  api-venv:
