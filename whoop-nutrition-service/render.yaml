services:
  - type: web
    name: whoop-nutrition-api
    runtime: docker
    rootDir: whoop-nutrition-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Same region as the Supabase project (eu-central-1): every request opens
    # fresh DB connections (NullPool), so cross-region RTT multiplies fast —
    # from oregon, whoop-service's /health blew past Render's 5s check.
    region: frankfurt
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
