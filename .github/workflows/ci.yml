name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job per Python service, each in its own directory with its own
  # uv.lock. All three share one Postgres and one Redis — the test fixtures
  # take DATABASE_URL/REDIS_URL from the environment.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [whoop-service, whoop-insight-service, whoop-nutrition-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  # Builds the exact image Render deploys and fails on fixable HIGH/CRITICAL CVEs.
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [whoop-service, whoop-insight-service, whoop-nutrition-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:ci ${{ matrix.service }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whoop-ui-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whoop-ui-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          WHOOP_SERVICE_URL: http://localhost:8000
          INSIGHT_SERVICE_URL: http://localhost:8001
          NUTRITION_SERVICE_URL: http://localhost:8002
