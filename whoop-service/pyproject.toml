[project]
name = "whoop-platform"
version = "0.1.0"
description = "Multi-user, batch-scale WHOOP data sync platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "rq>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is how pytest itself works; S105/S106 flag fixture
# fakes ("test-api-key", "fake-access-token") as if they were real
# hardcoded secrets. Both are the standard, expected exemption for a
# test directory — production code under services/, core/, api/,
# workers/ gets no such exemption.
"tests/*" = ["S101", "S105", "S106", "S110"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole test session, matching how the app actually
# runs (one event loop per process, in uvicorn or an RQ worker). Without
# this, pytest-asyncio's default per-test loop breaks pooled asyncpg
# connections created in one test's loop when a later test reuses them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
